name: Bug
description: Report a reproducible BLARCHY problem
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        BLARCHY is a personal Arch + Hyprland environment. Please include enough detail to reproduce the problem on the supported standalone install path.

  - type: input
    id: system-details
    attributes:
      label: System details
      placeholder: e.g. BLARCHY commit, kernel, GPU, and relevant hardware
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: What's wrong?
      description: Describe the issue, include reproduction steps, and attach `omarchy debug --no-sudo --print` output when relevant
    validations:
      required: true
