name: Bug
description: Report a reproducible blarchy problem
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Blarchy is a personal Arch + Niri environment. Please include enough detail to reproduce the problem on the supported install path (`./install.sh` on a minimal Arch system).

  - type: input
    id: system-details
    attributes:
      label: System details
      placeholder: e.g. blarchy commit, kernel, GPU, and relevant hardware
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: What's wrong?
      description: Describe the issue, include reproduction steps, and attach `./test/smoke` output when relevant
    validations:
      required: true
