general {
  lock_cmd = pidof hyprlock || hyprlock --grace 0 --immediate-render --no-fade-in
  before_sleep_cmd = loginctl lock-session
  after_sleep_cmd = hyprctl dispatch dpms on
  inhibit_sleep = 3
}

listener {
  timeout = 600
  on-timeout = $HOME/.local/bin/keep-awake idle-action hyprlock
}

listener {
  timeout = 900
  on-timeout = $HOME/.local/bin/keep-awake idle-action hyprctl dispatch dpms off
  on-resume = hyprctl dispatch dpms on
}
