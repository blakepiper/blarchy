# Lock screen colors follow the Ghostty Tokyo Night palette.

$font = Tamsyn

general {
  hide_cursor = true
  ignore_empty_input = false
  immediate_render = true
  text_trim = true
}

background {
  monitor =
  color = rgba(16, 24, 39, 1.0)
}

# Current time.
label {
  monitor =
  text = $TIME
  color = rgba(192, 202, 245, 1.0)
  font_size = 78
  font_family = $font
  position = 0, -190
  halign = center
  valign = center
}

# Current date.
label {
  monitor =
  text = cmd[update:60000] date +"%A, %d %B %Y"
  color = rgba(169, 177, 214, 1.0)
  font_size = 18
  font_family = $font
  position = 0, -105
  halign = center
  valign = center
}

# Account name.
label {
  monitor =
  text = $USER
  color = rgba(169, 177, 214, 0.72)
  font_size = 16
  font_family = $font
  position = 0, 105
  halign = center
  valign = center
}

input-field {
  monitor =
  size = 380, 72
  outline_thickness = 2
  rounding = 12

  inner_color = rgba(16, 24, 39, 0.94)
  outer_color = rgba(122, 162, 247, 1.0)
  check_color = rgba(158, 206, 106, 1.0)
  fail_color = rgba(247, 118, 142, 1.0)
  capslock_color = rgba(247, 118, 142, 1.0)

  font_color = rgba(192, 202, 245, 1.0)
  font_family = $font
  dots_size = 0.25
  dots_spacing = 0.28
  fade_on_empty = false

  placeholder_text = Enter password to unlock
  check_text = Authenticating...
  fail_text = $PAMFAIL

  position = 0, 0
  halign = center
  valign = center
}
