# Kitty terminal configuration.

# Font
font_family JetBrainsMono Nerd Font
bold_font auto
italic_font auto
bold_italic_font auto
font_size 11.0

# Window
window_padding_width 10
hide_window_decorations yes
confirm_os_window_close 0

# Keybindings
map ctrl+insert copy_to_clipboard
map shift+insert paste_from_clipboard
# Send Shift+Enter as CSI-u so TUIs can distinguish it from Enter.
map shift+enter send_text all \e[13;2u

# Remote control for helpers and tmux integration
allow_remote_control yes
listen_on unix:{kitty_pid}

# Behavior
cursor_shape block
cursor_blink_interval 0
shell_integration no-cursor
enable_audio_bell no
copy_on_select yes
strip_trailing_spaces smart

# Colors (Tokyo Night)
foreground #c0caf5
background #1a1b26
selection_foreground #1a1b26
selection_background #7dcfff
cursor #c0caf5
cursor_text_color #1a1b26
color0 #15161e
color1 #f7768e
color2 #9ece6a
color3 #e0af68
color4 #7aa2f7
color5 #bb9af7
color6 #7dcfff
color7 #a9b1d6
color8 #414868
color9 #f7768e
color10 #9ece6a
color11 #e0af68
color12 #7aa2f7
color13 #bb9af7
color14 #7dcfff
color15 #c0caf5

# Minimal tab bar
tab_bar_edge bottom
tab_bar_style powerline
tab_powerline_style slanted
tab_title_template {title}{' :{}:'.format(num_windows) if num_windows > 1 else ''}
active_tab_foreground #1a1b26
active_tab_background #7aa2f7
inactive_tab_foreground #a9b1d6
inactive_tab_background #24283b
