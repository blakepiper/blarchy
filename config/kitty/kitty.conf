# Kitty terminal configuration.

# Font
font_family JetBrainsMono Nerd Font
bold_font auto
italic_font auto
bold_italic_font auto
font_size 11.0

# Window
window_padding_width 10
hide_window_decorations yes
confirm_os_window_close 0

# Keybindings
map ctrl+insert copy_to_clipboard
map shift+insert paste_from_clipboard
# Send Shift+Enter as CSI-u so TUIs can distinguish it from Enter.
map shift+enter send_text all \e[13;2u

# Behavior
cursor_shape block
cursor_blink_interval 0
shell_integration no-cursor
enable_audio_bell no
copy_on_select yes
strip_trailing_spaces smart

# Colors (Ubuntu: aubergine background, Tango palette)
foreground #eeeeec
background #300a24
selection_foreground #eeeeec
selection_background #75507b
cursor #eeeeec
cursor_text_color #300a24
color0 #2e3436
color1 #cc0000
color2 #4e9a06
color3 #c4a000
color4 #3465a4
color5 #75507b
color6 #06989a
color7 #d3d7cf
color8 #555753
color9 #ef2929
color10 #8ae234
color11 #fce94f
color12 #729fcf
color13 #ad7fa8
color14 #34e2e2
color15 #eeeeec

# Minimal tab bar
tab_bar_edge bottom
tab_bar_style powerline
tab_powerline_style slanted
tab_title_template {title}{' :{}:'.format(num_windows) if num_windows > 1 else ''}
active_tab_foreground #300a24
active_tab_background #e95420
inactive_tab_foreground #eeeeec
inactive_tab_background #2c001e
