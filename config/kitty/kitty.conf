# Kitty terminal configuration.

# Font
font_family JetBrainsMono Nerd Font
bold_font auto
italic_font auto
bold_italic_font auto
font_size 11.0

# Window
window_padding_width 10
hide_window_decorations yes
confirm_os_window_close 0
# Keep terminal backgrounds translucent while leaving text and other content
# crisp; Niri adds only a small adjustment to unfocused Kitty windows.
background_opacity 0.60
# Some remote shells paint the whole terminal with this alternate background;
# keep that surface transparent at the same level as Kitty's default one.
transparent_background_colors #4e6c5e@0.60

# Keybindings
map ctrl+insert copy_to_clipboard
map shift+insert paste_from_clipboard
# Send Shift+Enter as CSI-u so TUIs can distinguish it from Enter.
map shift+enter send_text all \e[13;2u

# Behavior
shell /bin/bash
cursor_shape block
cursor_blink_interval 0
shell_integration no-cursor
enable_audio_bell no
copy_on_select yes
strip_trailing_spaces smart

# Colors (Seafoam Dusk: charcoal surfaces with seafoam highlights)
foreground #e4f0eb
background #171c1b
selection_foreground #f1fff9
selection_background #3b685c
cursor #b8f2d6
cursor_text_color #17211e
color0 #202925
color1 #d97786
color2 #71c8a0
color3 #d8be73
color4 #7faed0
color5 #3e6257
color6 #65ceb5
color7 #c5d5ce
color8 #667b73
color9 #f0919b
color10 #9be6bc
color11 #f1d996
color12 #a0c9e2
color13 #7db9a0
color14 #a2f0d6
color15 #f0faf6

# Minimal tab bar
tab_bar_edge bottom
tab_bar_style powerline
tab_powerline_style slanted
tab_title_template {title}{' :{}:'.format(num_windows) if num_windows > 1 else ''}
active_tab_foreground #17211e
active_tab_background #9fe3c4
inactive_tab_foreground #e4f0eb
inactive_tab_background #202925
