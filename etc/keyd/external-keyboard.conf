# Swap the Alt/Meta positions on the attached external keyboard only.
# The physical Command key is in the Alt position, so it becomes Super.
# Both keyboard interfaces exposed by this device are listed; the final
# identifier is keyd's stable per-interface capability hash.

[ids]
k:1fc9:e8c7:d6aad24d
k:1fc9:e8c7:16d42786

[main]
leftalt = layer(meta)
leftmeta = layer(alt)
rightalt = layer(meta)
rightmeta = layer(alt)
